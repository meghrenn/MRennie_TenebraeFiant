<!DOCTYPE html>
<html lang="en-CAN">

<head>
    <title>Eldritch</title>
    <link rel="icon" type="image/png" href="../images/logo/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="../js/scripts.js"></script>
</head>

<body data-group-id="puzzling" data-page-id="eldritch">
    <header id="main-header">
        <ul>
            <li id="about" class="basic-padding">About</li>
            <li id="help" class="basic-padding">Trouble</li>
            <li id="progress" class="basic-padding">Progress</li>
        </ul>
    </header>
    <main class="thick-padding containment">
        <h1>Eldritch</h1>
        <p>God, what a horrid creature! That was nothing like I could have imagined. What could it possibly want from us?</p>
        <p>We have to keep following my visions. There must be more to learn. Some north star to lead us out of this mess….</p>

        <div class="center-container thick-padding marginal-margin">
            <div id="continue" class="button basic-padding">Return to the Origins</div>
        </div>
    </main>
    <div id="header-container"></div>
</body>
<script>
    document.getElementById("continue").addEventListener("click", function () {
        document.body.style.backgroundColor = 'var(--green-dark)';
        document.getElementById("main-header").style.backgroundColor = 'var(--green-medium)';
        setTimeout(function () {
            document.body.style.backgroundColor = '';
            document.getElementById("main-header").style.backgroundColor = '';
            window.location.href = "../beginning/origins.html";
        }, 700);
    });
</script>

</html>
