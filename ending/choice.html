<body data-group-id="ending" data-page-id="encroaching-end">
    <header id="main-header">
        <ul>
            <li id="about" class="basic-padding">About</li>
            <li id="help" class="basic-padding">Problems</li>
            <li id="progress" class="basic-padding">Progress</li>
        </ul>
    </header>
    <main class="thick-padding containment right-container">
        <h1>The Choice</h1>
        <!-- <iframe
            data-tally-src="https://tally.so/embed/nPGX5e?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
            loading="lazy" width="100%" height="222" frameborder="0" marginheight="0" marginwidth="0"

        <form class="center-container" id="end-form">
            <div class="basic-padding">
                <label for="end">Is The University of Lethbridge worth saving?</label>
                <div id="end" style="display:flex; justify-content:space-evenly;">
                    <input type="radio" id="yes" name="answer" value="yes" required>
                    <label for="yes">
                        <h2>Yes</h2>
                    </label>
                    <input type="radio" id="no" name="answer" value="no" required>
                    <label for="no">
                        <h2>No</h2>
                    </label>
                </div>
            </div>
            <input class="button basic-padding" type="submit" value="Submit">
        </form>
    </main>
    <div id="header-container"></div>
</body>

<script>
    document.getElementById('end-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        const response = formData.get('answer');

        var selectedOption = document.querySelector('input[name="answer"]:checked');
        var enteredPassword = selectedOption.value;
        if (selectedOption) {
            if (enteredPassword === "yes") {
                document.body.style.backgroundColor = 'var(--green-dark)';
                document.getElementById("main-header").style.backgroundColor = 'var(--green-medium)';
                setTimeout(function () {
                    document.body.style.backgroundColor = '';
                    document.getElementById("main-header").style.backgroundColor = '';
                    window.location.href = "aperture3.html";
                }, 700);
            }
            else {
                if (enteredPassword === "no") {
                    document.body.style.backgroundColor = 'var(--green-dark)';
                    document.getElementById("main-header").style.backgroundColor = 'var(--green-medium)';
                    setTimeout(function () {
                        document.body.style.backgroundColor = '';
                        document.getElementById("main-header").style.backgroundColor = '';
                        window.location.href = "aperture2.html";
                    }, 700);
                }
            }
        } else {
            document.body.style.backgroundColor = 'var(--red-dark)';
            document.getElementById("main-header").style.backgroundColor = 'var(--red-medium)';
            setTimeout(function () {
                alert("You need to make a stand. The fate of the university depends on it.");
                document.body.style.backgroundColor = '';
                document.getElementById("main-header").style.backgroundColor = '';
            }, 500);
        }
    })

</script>

</html>
