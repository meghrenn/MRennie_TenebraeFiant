    <script src="../js/scripts.js"></script>
</head>

<style>
    main p {
        opacity: 0;
        transition: opacity 1s ease-in-out;
    }

    p.visible {
        opacity: 1;
    }
</style>

<body data-group-id="ending" data-page-id="the-end">
    <header id="main-header">
        <ul>
            <li id="about" class="basic-padding">About</li>
            <li id="help" class="basic-padding">Problems</li>
            <li id="progress" class="basic-padding">Progress</li>
        </ul>
    </header>
    <main class="thick-padding containment right-container">
        <h1>The End</h1>
        <p>This is the end of a long road.</p>
        <p>There's one last light left on.</p>
        <p>The motion sensors know nobody's home.</p>
        <p>They click off.</p>
        <i><a id="thanks">Thank you for playing.</a></i>
        <p><iframe width="80vw" height="auto" src="https://www.youtube.com/embed/VTUBrLPspYI?si=QxMdkCACucaHbknQ"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </p>
    </main>
    <div id="header-container"></div>
</body>
<script>
    $(document).ready(function () {
        const paragraphs = $('main p');
        function fadeInParagraphs(index) {
            if (index < paragraphs.length) {
                paragraphs.eq(index).addClass('visible');
                setTimeout(() => fadeInParagraphs(index + 1), 1000);
            }
        }
        fadeInParagraphs(0);
    });

</script>
